name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: for f in app/js/*.js; do node --check "$f"; done
      - name: Check Python tools
        run: python -m py_compile tools/*.py
      - name: Build package
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*.ipk
