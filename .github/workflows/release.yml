name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches appinfo version
        run: |
          version=$(python -c 'import json; print(json.load(open("app/appinfo.json"))["version"])')
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build package
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python tools/package.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.ipk --generate-notes
